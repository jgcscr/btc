name: 'Validation Guards'

permissions:
  contents: read

'on':
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/validation-guards.yml'
      - 'src/data/macro_loader.py'
      - 'src/data/onchain_loader.py'
      - 'src/scripts/audit_feature_parity.py'
      - 'src/scripts/build_training_dataset.py'
      - 'src/scripts/build_training_dataset_direction.py'
      - 'src/scripts/build_training_dataset_multi_horizon.py'
      - 'src/scripts/check_featurelift_report_references.py'
      - 'src/scripts/generate_featurelift_comparison_report.py'
      - 'src/scripts/run_refresh_and_predict.py'
      - 'src/scripts/run_live_wrapper_smoke_check.py'
      - 'src/trading/intrabar_features.py'
      - 'tests/test_direction_feature_reliability_filters.py'
      - 'tests/test_feature_leakage_guards.py'
      - 'tests/test_featurelift_report_reference_check.py'
      - 'tests/test_intrabar_feature_parity.py'
      - 'tests/test_macro_loader_and_integration.py'
      - 'tests/test_onchain_loader_and_integration.py'
      - 'tests/test_runtime_feature_parity_and_validation.py'
      - 'tests/test_run_live_wrapper_smoke_check.py'
      - 'artifacts/analysis/featurelift_20260331/comparison_report.json'
      - 'artifacts/analysis/featurelift_20260331_rerun/comparison_report.json'
      - 'artifacts/analysis/featurelift_20260331_rerun/comparison_report.md'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/validation-guards.yml'
      - 'src/data/macro_loader.py'
      - 'src/data/onchain_loader.py'
      - 'src/scripts/audit_feature_parity.py'
      - 'src/scripts/build_training_dataset.py'
      - 'src/scripts/build_training_dataset_direction.py'
      - 'src/scripts/build_training_dataset_multi_horizon.py'
      - 'src/scripts/check_featurelift_report_references.py'
      - 'src/scripts/generate_featurelift_comparison_report.py'
      - 'src/scripts/run_refresh_and_predict.py'
      - 'src/scripts/run_live_wrapper_smoke_check.py'
      - 'src/trading/intrabar_features.py'
      - 'tests/test_direction_feature_reliability_filters.py'
      - 'tests/test_feature_leakage_guards.py'
      - 'tests/test_featurelift_report_reference_check.py'
      - 'tests/test_intrabar_feature_parity.py'
      - 'tests/test_macro_loader_and_integration.py'
      - 'tests/test_onchain_loader_and_integration.py'
      - 'tests/test_runtime_feature_parity_and_validation.py'
      - 'tests/test_run_live_wrapper_smoke_check.py'
      - 'artifacts/analysis/featurelift_20260331/comparison_report.json'
      - 'artifacts/analysis/featurelift_20260331_rerun/comparison_report.json'
      - 'artifacts/analysis/featurelift_20260331_rerun/comparison_report.md'

jobs:
  parity-and-report-guards:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          if [[ -f requirements-tests.txt ]]; then pip install -r requirements-tests.txt; fi

      - name: Run broader parity and data-integrity tests
        run: |
          python -m pytest \
            tests/test_runtime_feature_parity_and_validation.py \
            tests/test_intrabar_feature_parity.py \
            tests/test_macro_loader_and_integration.py \
            tests/test_onchain_loader_and_integration.py \
            tests/test_direction_feature_reliability_filters.py \
            tests/test_feature_leakage_guards.py \
            tests/test_featurelift_report_reference_check.py \
            tests/test_run_live_wrapper_smoke_check.py

      - name: Regenerate featurelift comparison reports
        run: python -m src.scripts.generate_featurelift_comparison_report

      - name: Reject stale superseded report references
        run: python -m src.scripts.check_featurelift_report_references

      - name: Ensure regenerated reports are committed
        run: |
          git diff --exit-code -- \
            artifacts/analysis/featurelift_20260331/comparison_report.json \
            artifacts/analysis/featurelift_20260331_rerun/comparison_report.json \
            artifacts/analysis/featurelift_20260331_rerun/comparison_report.md