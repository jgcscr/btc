name: Cadence Operations

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      cadence:
        description: Cadence to run
        required: true
        default: daily
        type: choice
        options:
          - daily
          - weekly
          - monthly
  schedule:
    - cron: '15 1 * * *'
    - cron: '30 2 * * 1'
    - cron: '45 3 1 * *'

jobs:
  run-cadence:
    runs-on: self-hosted
    timeout-minutes: 360
    env:
      PYTHONUNBUFFERED: '1'
      PYTHON_BIN: python
      CADENCE_ARTIFACTS_ROOT_URI: ${{ vars.CADENCE_ARTIFACTS_ROOT_URI != '' && vars.CADENCE_ARTIFACTS_ROOT_URI || '/workspaces/btc/artifacts' }}
      CADENCE_DEPLOY_MANIFEST_URI: ${{ vars.CADENCE_DEPLOY_MANIFEST_URI }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          if [[ -f requirements-tests.txt ]]; then pip install -r requirements-tests.txt; fi

      - name: Resolve cadence
        id: cadence
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            cadence="${{ github.event.inputs.cadence }}"
          else
            case "${{ github.event.schedule }}" in
              '15 1 * * *') cadence='daily' ;;
              '30 2 * * 1') cadence='weekly' ;;
              '45 3 1 * *') cadence='monthly' ;;
              *)
                echo "Unknown schedule: ${{ github.event.schedule }}" >&2
                exit 1
                ;;
            esac
          fi
          echo "cadence=$cadence" >> "$GITHUB_OUTPUT"

      - name: Validate local artifact root
        if: ${{ env.CADENCE_ARTIFACTS_ROOT_URI == '' }}
        run: |
          echo "CADENCE_ARTIFACTS_ROOT_URI must be set to a local filesystem path visible to the self-hosted runner." >&2
          exit 1

      - name: Reject remote artifact URIs
        if: ${{ contains(env.CADENCE_ARTIFACTS_ROOT_URI, '://') || contains(env.CADENCE_DEPLOY_MANIFEST_URI, '://') }}
        run: |
          echo "This workflow is configured for self-hosted local-only cadence execution." >&2
          echo "Use local filesystem paths for CADENCE_ARTIFACTS_ROOT_URI and CADENCE_DEPLOY_MANIFEST_URI; remote URIs are not supported here." >&2
          exit 1

      - name: Preflight local cadence artifacts
        id: preflight
        run: |
          args=(--artifacts-root-uri "${CADENCE_ARTIFACTS_ROOT_URI}" --validate-only)
          if [[ -n "${CADENCE_DEPLOY_MANIFEST_URI}" ]]; then
            args+=(--manifest-uri "${CADENCE_DEPLOY_MANIFEST_URI}")
          fi
          python -m src.scripts.bootstrap_cadence_artifacts "${args[@]}" | tee cadence_preflight.json
          manifest_uri=$(python -c "import json, pathlib; payload=json.loads(pathlib.Path('cadence_preflight.json').read_text(encoding='utf-8')); print(payload.get('manifest_uri', ''))")
          run_id=$(python -c "import json, pathlib; payload=json.loads(pathlib.Path('cadence_preflight.json').read_text(encoding='utf-8')); print(payload.get('run_id', ''))")
          echo "manifest_uri=${manifest_uri}" >> "$GITHUB_OUTPUT"
          echo "run_id=${run_id}" >> "$GITHUB_OUTPUT"

      - name: Log resolved cadence inputs
        run: |
          echo "Artifact root: ${CADENCE_ARTIFACTS_ROOT_URI}"
          echo "Deploy manifest: ${{ steps.preflight.outputs.manifest_uri }}"
          echo "Trustworthy run id: ${{ steps.preflight.outputs.run_id }}"

      - name: Bootstrap cadence artifacts
        if: ${{ env.CADENCE_ARTIFACTS_ROOT_URI != '' }}
        run: |
          args=(--artifacts-root-uri "${CADENCE_ARTIFACTS_ROOT_URI}")
          if [[ -n "${CADENCE_DEPLOY_MANIFEST_URI}" ]]; then
            args+=(--manifest-uri "${CADENCE_DEPLOY_MANIFEST_URI}")
          fi
          python -m src.scripts.bootstrap_cadence_artifacts "${args[@]}"

      - name: Run cadence
        run: |
          chmod +x scripts/run_cadence.sh
          ./scripts/run_cadence.sh "${{ steps.cadence.outputs.cadence }}"

      - name: Upload prediction artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cadence-${{ steps.cadence.outputs.cadence }}-${{ github.run_id }}
          path: |
            artifacts/predictions/latest.json
            artifacts/monitoring/latest.json
            artifacts/monitoring/trade_ready_summary.json
            artifacts/reliability/*/summary/edge_trustworthiness.json
            artifacts/reliability/*/summary/walkforward_labeled_reconciliation.json
          if-no-files-found: warn