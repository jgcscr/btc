# Shadow-only config for simplified ensemble weights.
# Use this for offline A/B and shadow monitoring, not for live promotion.
hours: 360
targets:
  - 0.25
  - 1
  - 4
  - 8
  - 12
p_up_min: 0.45
ret_min: 0.0
direction_threshold: 0.6
auto_direction_threshold: true
thresholds_json: artifacts/models/calibrated_thresholds_merged.json
data_quality:
  enabled: false
  max_staleness_hours: 6.0
  max_missing_ratio: 0.01
  max_zero_volume_ratio: 0.2
  min_rows: 120
confidence_min: 0.0
position_size_floor: 0.0
position_size_cap: 1.0
abstention_policy:
  enabled: true
  min_confidence: 0.2
  min_abs_expected_value: 0.0002
  min_edge_over_fee: 0.0001
  require_positive_ev: true
  hold_prob_center: 0.5
  hold_prob_band: 0.03
uncertainty_policy:
  enabled: true
  alpha: 0.2
  hold_prob_center: 0.5
  max_interval_width: 0.75
  require_center_cross: true
  min_component_count: 3
trade_decision_policy:
  enabled: true
  model_path: artifacts/models/trade_decision_model.json
  threshold: 0.55
  use_oof_expected_value: true
  oof_expected_value_mode: max_with_raw_calibrated
  enforce_positive_oof_envelope: true
  positive_oof_envelope_mode: populated_bin_sign
  block_when_no_positive_oof_bin: true
  positive_oof_min_samples: 4
  allow_raw_ev_fallback_when_no_positive_oof_bin: true
  raw_ev_fallback_quantile: 0.9
  raw_ev_fallback_min_edge_over_fee: 0.0
  min_expected_net: 0.0
  min_edge_over_fee: 0.0
  replace_threshold_rule: true
  require_direction_ret_alignment: true
  midband_veto:
    enabled: true
    p_up_low: 0.56
    p_up_high: 0.59
    high_inclusive: false
    min_abs_ret_pred: 0.001
    max_abs_ret_pred: null
    regime_states: [chop]
direction_output_policy:
  enabled: true
  horizons: [1]
  neutral_band: 0.02
  calibration_path: artifacts/models/direction_output_isotonic_1h.json
  use_trade_probability_fallback: true
  marginal_rerank:
    enabled: true
    horizons: [1]
    lower: 0.5
    upper: 0.6
    min_component_count: 2
    use_raw_probability_gate: true
    weight_specs:
      default: transformer:1.0,transformer_large:0.0,lstm:1.0,bilstm:1.0,gru:1.5,cnn_lstm:0.0,cnn_bilstm:0.0,garch_lstm:0.0,xgb:0.0,lgbm:0.0
      trend_ignition: transformer:1.0,transformer_large:0.0,lstm:1.0,bilstm:1.0,gru:1.5,cnn_lstm:0.0,cnn_bilstm:0.0,garch_lstm:0.0,xgb:0.0,lgbm:0.0
      neutral: transformer:1.0,transformer_large:0.0,lstm:1.0,bilstm:1.0,gru:1.5,cnn_lstm:0.0,cnn_bilstm:0.0,garch_lstm:0.0,xgb:0.0,lgbm:0.0
      chop: transformer:1.0,transformer_large:0.0,lstm:1.0,bilstm:1.0,gru:1.5,cnn_lstm:0.0,cnn_bilstm:0.0,garch_lstm:0.0,xgb:0.0,lgbm:0.0
feature_coverage_policy:
  enabled: true
  max_imputed_zero_columns: 12
  max_imputed_zero_ratio: 0.2
  max_source_lag_hours: 6.0
  block_on_violation: true
  ignored_columns:
    - funding_rate
    - fut_close
    - fut_close_delta_1h
    - fut_close_pct_change_1h
    - fut_close_zscore_7h
    - fut_high
    - fut_low
    - fut_open
    - fut_volume
    - fut_volume_delta_1h
    - fut_volume_pct_change_1h
    - open_interest
forecast_coherence_policy:
  enabled: true
  horizons: [1, 4, 8, 12]
  block_on_direction_ret_mismatch: true
  block_on_direction_projected_price_mismatch: true
  block_on_p_up_ret_mismatch: true
  p_up_neutral_band: 0.02
  min_p_up_edge: 0.05
  min_abs_ret_pred: 0.0
  exclude_blocked_horizons_from_voting: true
confluence_policy:
  enabled: true
  short_horizons: [1]
  mid_horizons: [4, 8, 12]
  min_support_ratio: 0.67
  min_aligned_horizons: 3
  require_mid_term_alignment: true
  min_mid_term_ratio: 0.67
  require_short_term_alignment: true
  min_short_term_ratio: 1.0
  dominant_ratio_floor: 0.67
execution_policy:
  enabled: true
  bias_horizons: [4, 8, 12]
  execution_horizons: [1, 4, 8, 12]
  require_bias_alignment: true
  immediate_entry_min_support_ratio: 0.8
  pullback_entry_min_support_ratio: 0.5
  immediate_entry_min_mid_ratio: 1.0
  pullback_entry_min_mid_ratio: 0.66
  high_execution_alignment_ratio: 0.5
  medium_execution_alignment_ratio: 0.5
  entry_zone_atr_mult: 0.25
  max_chase_atr_mult: 0.35
  session_lookback_bars: 8
  swing_lookback_bars: 6
  structure_buffer_atr_mult: 0.2
  minimum_rr_by_horizon:
    "0.25": 1.1
    "1": 1.25
    "4": 1.6
    "8": 1.75
    "12": 1.75
  time_stop_bars_by_horizon:
    "0.25": 4
    "1": 3
    "4": 2
    "8": 2
    "12": 2
  partial_take_profit:
    enabled: true
    tp1_r_multiple: 1.0
    tp1_size_fraction: 0.5
    move_stop_to_break_even: true
  trailing_stop:
    enabled: true
    activation_r_multiple: 1.0
    trail_buffer_atr_mult: 0.75
  analytics:
    enabled: true
    lookback_bars: 240
    mae_quantile: 0.75
    mfe_quantile: 0.75
    min_samples: 40
    regime_volatility_buckets:
      enabled: true
      regime_col: regime_state
      volatility_col: volatility_realized_24h
      min_bucket_samples: 12
      low_vol_quantile: 0.5
      max_projection_mfe_ratio: 1.25
      breakout_score_threshold: 0.8
      chop_score_threshold: 0.3
  no_trade_guards:
    enabled: true
    min_stop_distance_atr_mult: 0.35
    max_stop_distance_atr_mult: 3.0
    max_entry_deviation_atr_mult: 1.25
    require_favorable_entry_zone: true
  adaptive_take_profit:
    enabled: true
    min_rr_fraction_of_floor: 0.85
  target_range_stop_refinement:
    enabled: true
    horizons: [8, 12]
    confidence_min: 0.72
    buffer_std_mult: 1.5
    min_tighten_fraction: 0.1
  regime_templates:
    chop:
      tp_multiplier: 0.85
      time_stop_multiplier: 0.75
      size_multiplier: 0.75
    neutral:
      tp_multiplier: 1.0
      time_stop_multiplier: 1.0
      size_multiplier: 1.0
    trend_ignition:
      tp_multiplier: 1.25
      time_stop_multiplier: 1.5
      size_multiplier: 1.1
spot_provider: binanceus
write_artifacts: true
disable_monitoring_latest: false
# Simplified shadow policy from A/B experiments.
dir_model_weights: transformer:0.0,transformer_large:0.0,lstm:1.0,bilstm:0.0,gru:0.0,cnn_lstm:0.0,cnn_bilstm:0.0,garch_lstm:0.0,xgb:1.0,lgbm:1.0
trend_ignition:
  enabled: false
  model_path: artifacts/models/trend_ignition/xgb_trend_ignition.joblib
  probability_threshold: 0.6
  cooldown_hours: 6
direction_only_fallback:
  enabled: false
  prob_threshold: 0.62
  max_negative_ev: 0.0005
  size_factor: 0.5
  stop_take_ratio: 0.01
  cooldown_hours: 4
  ignition_ev_extension: 0.0002
adaptive_thresholds:
  enabled: true
  breakout_score_threshold: 0.8
  chop_score_threshold: 0.3
  breakout_scale: 0.9
  chop_scale: 1.1
  p_up_min_floor: 0.35
  p_up_min_ceiling: 0.75
  ret_min_floor: -0.0005
  ret_min_ceiling: 0.003
regime_model_weights:
  enabled: true
  trend_ignition:
    "1": "transformer:0.0,lstm:1.5,bilstm:1.0,gru:1.0,cnn_lstm:0.5,cnn_bilstm:0.5,garch_lstm:0.5,xgb:1.5,lgbm:1.0"
    "4": "transformer:0.5,lstm:1.5,bilstm:1.0,gru:1.0,cnn_lstm:0.5,cnn_bilstm:0.5,garch_lstm:0.5,xgb:1.5,lgbm:1.0"
    "8": "transformer:0.5,lstm:1.5,bilstm:1.0,gru:1.0,cnn_lstm:0.5,cnn_bilstm:0.5,garch_lstm:0.5,xgb:1.5,lgbm:1.0"
    "12": "transformer:0.5,lstm:1.5,bilstm:1.0,gru:1.0,cnn_lstm:0.5,cnn_bilstm:0.5,garch_lstm:0.5,xgb:1.5,lgbm:1.0"
  neutral:
    "1": "transformer:0.0,lstm:1.0,bilstm:1.0,gru:1.0,cnn_lstm:0.5,cnn_bilstm:0.5,garch_lstm:0.5,xgb:1.5,lgbm:1.5"
    "4": "transformer:0.5,lstm:1.0,bilstm:1.0,gru:1.0,cnn_lstm:0.5,cnn_bilstm:0.5,garch_lstm:0.5,xgb:1.5,lgbm:1.5"
    "8": "transformer:0.5,lstm:1.0,bilstm:1.0,gru:1.0,cnn_lstm:0.5,cnn_bilstm:0.5,garch_lstm:0.5,xgb:1.5,lgbm:1.5"
    "12": "transformer:0.5,lstm:1.0,bilstm:1.0,gru:1.0,cnn_lstm:0.5,cnn_bilstm:0.5,garch_lstm:0.5,xgb:1.5,lgbm:1.5"
  chop:
    "1": "transformer:0.0,lstm:1.5,bilstm:1.5,gru:1.5,cnn_lstm:0.0,cnn_bilstm:0.0,garch_lstm:1.0,xgb:1.5,lgbm:1.5"
    "4": "transformer:0.0,lstm:1.5,bilstm:1.5,gru:1.5,cnn_lstm:0.0,cnn_bilstm:0.0,garch_lstm:1.0,xgb:1.5,lgbm:1.5"
    "8": "transformer:0.0,lstm:1.5,bilstm:1.5,gru:1.5,cnn_lstm:0.0,cnn_bilstm:0.0,garch_lstm:1.0,xgb:1.5,lgbm:1.5"
    "12": "transformer:0.0,lstm:1.5,bilstm:1.5,gru:1.5,cnn_lstm:0.0,cnn_bilstm:0.0,garch_lstm:1.0,xgb:1.5,lgbm:1.5"
regime_model_dirs:
  enabled: true
  trend_ignition:
    "1h": artifacts/models/xgb_dir1h_v5
    "4h": artifacts/models/xgb_dir4h_v2
    "8h": artifacts/models/xgb_dir8h_v2
    "12h": artifacts/models/xgb_dir12h_v2
  neutral:
    "1h": artifacts/models/xgb_dir1h_v5
    "4h": artifacts/models/xgb_dir4h_v2
    "8h": artifacts/models/xgb_dir8h_v2
    "12h": artifacts/models/xgb_dir12h_v2
  chop:
    "1h": artifacts/models/xgb_dir1h_v5
    "4h": artifacts/models/xgb_dir4h_v2
    "8h": artifacts/models/xgb_dir8h_v2
    "12h": artifacts/models/xgb_dir12h_v2
intrabar_aggregation:
  enabled: true
  interval: 15m
  hours_multiplier: 4
  max_rows: 4000
target_range_models:
  enabled: true
  model_dir: artifacts/models/target_ranges
  horizons: [4, 8, 12]
  override_ratio: 0.01
  confidence_rmse_scale: 0.01
