cv:
  folds: 2
  mode: expanding
  train_size: 120
  val_size: 40
  test_size: 24
  gap: 4
  purge_size: 0
  embargo_size: 4

search:
  horizons: [1, 4, 12]
  n_trials: 5
  timeout: null
  threshold_objective: cumret_with_dd_constraint
  utility_dd_penalty: 2.0
  utility_std_penalty: 0.5
  utility_turnover_penalty: 0.5
  max_drawdown: -0.08
  min_trades: 10
  meta_weight_threshold: 0.52
  meta_component_frame_csv: artifacts/monitoring/meta_component_frame_1h.csv
  meta_component_frame_source: artifacts/backtests/historical_1h_pup060_full/backtest_signals.csv
  meta_component_columns: [xgb, transformer, lstm]
  meta_component_weights_from_audit_path: artifacts/analysis/direction_model_audit_latest.json
  paper_live_config: configs/run_refresh_and_predict.live_conservative_binance_only.yaml
  apply_direction_audit_to_paper_live: true
  direction_output_shadow:
    enabled: true
    apply_to_paper_live: true
    horizons: [1]
    marginal_horizon: 1h
    calibration_method: isotonic
    min_rows: 200
    neutral_band: 0.02
    include_reliability_snapshots: true
    apply_marginal_audit_weights: true
  upstream_direction_candidate:
    enabled: true
    apply_to_paper_live: false
    marginal_horizon: 1h
  trade_decision_chop_suppression_candidate:
    enabled: true
    apply_to_paper_live: false
    recent_window_rows: 288
    signal_col: signal_ensemble
    p_col: p_up
    ret_pred_col: ret_pred
    return_col: ret_ensemble_net
    regime_col: regime_state
    min_regime_rows: 2
    require_overall_regime_negative: true
  paper_live_dry_run: false

monitoring:
  horizons: ["1h", "4h", "12h"]
  triggers:
    baseline_window: 8
    recent_window: 4
    min_samples: 12
    max_abs_prob_drift: 0.08
    max_signal_rate_drift: 0.25

cadence:
  monthly_retrain_day: 1
  weekly_recalibration_weekday: mon

quality:
  enabled: true
  build_labeled_dataset: true
  backtest_csv: auto
  champion_gate_source: auto
  prefer_backtest: true
  lookback_rows: 50000
  lookback_hours: 8760
  min_labeled_rows: 300
  fold_size: 12
  walkforward_horizon: 1
  walkforward_dataset: artifacts/reliability/20260308T023631Z/summary/btc_features_1h_direction_splits.snapshot.npz
  walkforward_y_key: y
  walkforward_model_kind: xgb
  walkforward_signal_threshold: 0.5
  walkforward_fee_bps: 2.0
  walkforward_slippage_bps: 1.0
  walkforward_model_compare:
    enabled: true
    selection_policy: quality_guarded
    min_auc: 0.5
    folds: 5
    train_size: 36
    val_size: 12
    test_size: 10
    gap: 2
    purge_size: 0
    embargo_size: 2
    mode: rolling
    min_train_size: 20
    min_val_size: 10
    min_test_size: 10
    signal_threshold: 0.5
    fee_bps: 2.0
    slippage_bps: 1.0
