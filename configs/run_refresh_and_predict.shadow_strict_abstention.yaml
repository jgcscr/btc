# Shadow-only config for strict abstention stress test.
# Derived from run_refresh_and_predict.shadow_simplified.yaml
hours: 360
targets:
  - 0.25
  - 1
  - 4
  - 8
  - 12
p_up_min: 0.45
ret_min: 0.0
direction_threshold: 0.6
auto_direction_threshold: false
thresholds_json: artifacts/models/calibrated_thresholds_merged.json
data_quality:
  enabled: false
  max_staleness_hours: 6.0
  max_missing_ratio: 0.01
  max_zero_volume_ratio: 0.2
  min_rows: 120
confidence_min: 0.0
position_size_floor: 0.0
position_size_cap: 1.0
abstention_policy:
  enabled: true
  min_confidence: 0.45
  min_abs_expected_value: 0.0008
  min_edge_over_fee: 0.0006
  require_positive_ev: true
  hold_prob_center: 0.5
  hold_prob_band: 0.08
spot_provider: binanceus
write_artifacts: true
disable_monitoring_latest: false
dir_model_weights: transformer:0.0,transformer_large:0.0,lstm:1.0,bilstm:0.0,gru:0.0,cnn_lstm:0.0,cnn_bilstm:0.0,garch_lstm:0.0,xgb:1.0,lgbm:1.0
trend_ignition:
  enabled: false
  model_path: artifacts/models/trend_ignition/xgb_trend_ignition.joblib
  probability_threshold: 0.6
  cooldown_hours: 6
direction_only_fallback:
  enabled: false
  prob_threshold: 0.62
  max_negative_ev: 0.0005
  size_factor: 0.5
  stop_take_ratio: 0.01
  cooldown_hours: 4
  ignition_ev_extension: 0.0002
adaptive_thresholds:
  enabled: false
  breakout_score_threshold: 0.8
  chop_score_threshold: 0.3
  breakout_scale: 0.9
  chop_scale: 1.1
  p_up_min_floor: 0.35
  p_up_min_ceiling: 0.75
  ret_min_floor: -0.0005
  ret_min_ceiling: 0.003
regime_model_weights:
  enabled: false
intrabar_aggregation:
  enabled: true
  interval: 15m
  hours_multiplier: 4
  max_rows: 4000
target_range_models:
  enabled: false
  model_dir: artifacts/models/target_ranges
  horizons: [4, 8, 12]
  override_ratio: 0.01
  confidence_rmse_scale: 0.01
