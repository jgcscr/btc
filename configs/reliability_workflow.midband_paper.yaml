profile:
  id: midband_paper_evaluation
  name: Midband Paper Evaluation Runtime

cv:
  folds: 2
  mode: expanding
  train_size: 120
  val_size: 40
  test_size: 24
  gap: 4
  purge_size: 0
  embargo_size: 4

search:
  horizons: [1, 4, 8, 12]
  n_trials: 5
  timeout: null
  threshold_objective: cumret_with_dd_constraint
  utility_dd_penalty: 2.0
  utility_std_penalty: 0.5
  utility_turnover_penalty: 0.5
  max_drawdown: -0.08
  min_trades: 10
  meta_weight_threshold: 0.556
  paper_live_config: configs/run_refresh_and_predict.shadow_simplified.yaml
  direction_output_shadow:
    enabled: true
    apply_to_paper_live: true
    horizons: [1]
    marginal_horizon: 1h
    calibration_method: isotonic
    min_rows: 200
    neutral_band: 0.02
    include_reliability_snapshots: true
    apply_marginal_audit_weights: true
  upstream_direction_candidate:
    enabled: true
    apply_to_paper_live: false
    marginal_horizon: 1h
  trade_decision_chop_suppression_candidate:
    enabled: true
    apply_to_paper_live: false
    recent_window_rows: 288
    signal_col: signal_ensemble
    p_col: p_up
    ret_pred_col: ret_pred
    return_col: ret_ensemble_net
    regime_col: regime_state
    min_regime_rows: 2
    require_overall_regime_negative: true
  paper_live_dry_run: false

monitoring:
  horizons: ["1h", "4h", "8h", "12h"]
  triggers:
    baseline_window: 8
    recent_window: 4
    min_samples: 12
    max_abs_prob_drift: 0.08
    max_signal_rate_drift: 0.25

cadence:
  monthly_retrain_day: 1
  weekly_recalibration_weekday: mon

quality:
  enabled: true
  build_labeled_dataset: true
  backtest_csv: auto
  prefer_backtest: true
  lookback_rows: 50000
  lookback_hours: 8760
  min_labeled_rows: 300
  fold_size: 12
  walkforward_horizon: 1
  walkforward_dataset: artifacts/reliability/20260308T023631Z/summary/btc_features_1h_direction_splits.snapshot.npz
  walkforward_y_key: y
  walkforward_model_kind: xgb
  walkforward_signal_threshold: 0.5
  walkforward_fee_bps: 2.0
  walkforward_slippage_bps: 1.0
  walkforward_model_compare:
    enabled: true
    selection_policy: quality_guarded
    min_auc: 0.5
    folds: 5
    train_size: 36
    val_size: 12
    test_size: 10
    gap: 2
    purge_size: 0
    embargo_size: 2
    mode: rolling
    min_train_size: 20
    min_val_size: 10
    min_test_size: 10
    signal_threshold: 0.5
    fee_bps: 2.0
    slippage_bps: 1.0
    rolling_guard: true
    meta_margin: 0.001
    meta_min_rolling_trades: 40
  walkforward_labeled_reconciliation:
    enabled: true
    use_as_primary: true
    ts_col: ts
    min_rows: 80
    min_overlap_cum_ret: -0.005
    require_non_negative_overlap_selected: true
    max_abs_cum_ret_gap: 0.03
    min_overlap_folds: 4
    min_overlap_test_rows: 48
    overlap_compare:
      folds: 8
      train_size: 28
      val_size: 10
      test_size: 8
      gap: 1
      purge_size: 0
      embargo_size: 1
      mode: rolling
      min_train_size: 16
      min_val_size: 8
      min_test_size: 8
      selection_policy: quality_guarded
      min_auc: 0.5
    overlap_model_selection:
      enabled: true
      primary_model: xgb
      fallback_model: meta_stack
      min_ret_improvement: 0.0
      only_when_primary_negative: true
      require_fallback_auc_non_worse: false
      min_fallback_trades: 10
    enforce_for_paper_live: true
  overlap_pre_tuning:
    enabled: true
    use_overlap_feature_reliability_for_ablation: true
    feature_reliability:
      enabled: true
      baseline_window: 80
      recent_window: 40
      min_score: 0.55
      max_features: 0
    model_pruning:
      enabled: true
      min_cum_ret: 0.0
      min_trade_count: 10
      require_viable_model_for_tuning: true
      fallback_tuning:
        enabled: true
        p_up_grid: "0.58,0.60,0.62"
        ret_min_grid: "0.0,0.0001,0.0002"
        direction_threshold_grid: "0.54,0.56,0.58"
        min_trades: 10
        max_drawdown: -0.12
        min_cum_ret: 0.0
        selection_metric: economics_score
        economics_turnover_penalty: 0.002
        economics_downside_penalty: 2.0
        full_min_trades: 10
        full_min_cum_ret: 0.0
        stability_gap_penalty: 1.5
        max_stability_gap: 0.03
        min_overlap_rows: 80
        enforce_deployable: true
  canonical_direction_dataset:
    enabled: false
    rebuild_hourly: false
    output_dir: artifacts/datasets
    meta_path: artifacts/datasets/btc_features_1h_direction_meta.json
    enforce_binary_label_policy: false
    threshold: 0.0
    labeling_scheme: triple_barrier
    tb_horizon_steps: 3
    tb_vol_window: 24
    tb_upper_mult: 1.5
    tb_lower_mult: 1.5
    no_trade_abs_ret: 0.0
    no_trade_vol_mult: 0.0
  quality_input: artifacts/monitoring/labeled_backtest_1h.csv
  incumbent_quality_path: artifacts/monitoring/model_quality_incumbent_1h_backtest.json
  incumbent_backtest_csv: artifacts/monitoring/labeled_backtest_1h_incumbent.csv
  min_auc_delta: 0.0
  max_brier_increase: 0.0
  max_ece_increase: 0.01
  min_net_return: 0.0
  net_return_key: net_return_total
  min_trade_count: 10
  trade_count_key: trade_count
  require_champion_significance: true
  rolling_ab:
    enabled: true
    baseline_input: artifacts/monitoring/labeled_backtest_1h_incumbent.csv
    candidate_input: artifacts/backtests/historical_1h_pup060_full_simplified/backtest_signals.csv
    window_size: 240
    step_size: 24
    min_window_trades: 5
    allow_no_trade_baseline: true
  joint_threshold_tuning:
    enabled: true
    p_up_grid: "0.50,0.55,0.60,0.65"
    ret_min_grid: "-0.0002,0.0,0.0002,0.0005"
    direction_threshold_grid: "0.50,0.55,0.60"
    min_trades: 10
    max_drawdown: -0.12
    min_cum_ret: 0.0
    selection_metric: economics_score
    economics_turnover_penalty: 0.002
    economics_downside_penalty: 2.0
    stability_gap_penalty: 1.5
    max_stability_gap: 0.03
    min_overlap_rows: 80
    optimize_on_labeled_overlap: true
    enforce_deployable: true
    fallback_to_last_deployable_on_reject: true
    last_deployable_thresholds_path: artifacts/monitoring/calibrated_thresholds_last_deployable.json
    overlap_threshold_sweep_fallback:
      enabled: true
      threshold_grid: "0.45,0.48,0.50,0.52,0.55,0.58,0.60,0.62"
      min_trades: 10
      min_cum_ret: 0.0
  calibration_robustness:
    enabled: true
    method: platt
    baseline_window: 240
    recent_window: 120
    max_ece_drift: 0.02
    regime_aware: true
    regime_col: regime_state
    min_regime_rows: 20
  leakage_audit:
    enabled: true
    y_key: y
    corr_alert: 0.98
  cv_stress_sweep:
    enabled: true
    y_key: y
    folds: 2
    train_size: 180
    val_size: 60
    test_size: 40
    gap: 4
    purge_list: "0,2,4"
    embargo_list: "0,2,4"
    mode: expanding
  feature_reliability:
    enabled: true
    input: artifacts/datasets/btc_features_1h_direction_splits.npz
    baseline_window: 240
    recent_window: 120
    min_score: 0.55
    max_features: 0
  regime_weakness:
    enabled: true
    max_ece_drift: 0.02
    min_net_return: 0.0
  champion_challenger:
    enabled: true
    enforce: true
    baseline_input: auto
    candidate_input: auto
    baseline_col: ret_ensemble_net
    candidate_col: ret_ensemble_net
    alpha: 0.05
    n_boot: 2000
    seed: 42
  label_ablation:
    enabled: true
    threshold: 0.0
    folds: 2
    train_size: 180
    val_size: 60
    test_size: 40
    gap: 4
    purge_size: 0
    embargo_size: 4
    mode: expanding
    model_kind: xgb
    signal_threshold: 0.5
    fee_bps: 2.0
    slippage_bps: 1.0
    economics_min_trades: 10
    economics_min_cum_ret: 0.0
    economics_turnover_penalty: 0.002
    economics_downside_penalty: 2.0
  trade_decision_model:
    enabled: true
    target_col: ret_ensemble_net
    signal_col: signal_ensemble
    threshold: 0.58
    min_rows: 300
    min_candidate_rows: 60
    min_oof_rows: 40
    min_positive_oof_bins: 2
    candidate_only: false
    ev_calibration_source: hybrid
    ev_min_candidate_rows: 20
    ev_bins: 6
    min_bin_samples: 4
    raw_ev_calibration_source: weighted_hybrid
    raw_ev_candidate_weight: 4.0
    weak_band_candidate_only_veto:
      enabled: true
      official_mode: midband
      p_up_low: 0.55
