        min_abs_ret_pred: 0.0005
        max_abs_ret_pred: 0.001
        incumbent_reference_path: null
      retrospective:
        enabled: true
        window_size: 120
        step_size: 24
        min_rows: 80
        n_boot: 1000
        seed: 42
        longitudinal_output: artifacts/reliability/midband_shadow_longitudinal.json
