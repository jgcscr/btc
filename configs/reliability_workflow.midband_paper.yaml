        p_up_low: 0.55
        p_up_high: 0.60
        high_inclusive: false
        require_aligned: false
        use_midband_slice: true
        min_abs_ret_pred: 0.0005
        max_abs_ret_pred: 0.001
        incumbent_reference_path: null
      joint_direction_midband:
        enabled: false
